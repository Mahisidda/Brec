version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "8000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - REDIS_HOST=redis
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    volumes:
      - redis_data:/data

volumes:
  redis_data: 