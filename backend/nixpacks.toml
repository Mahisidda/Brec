providers = ["python"]
python_version = "3.10"

[phases.setup]
cmds = ["python -m venv /opt/venv"]

[phases.install]
cmds = [
    "/opt/venv/bin/pip install --upgrade pip",
    "/opt/venv/bin/pip install --no-cache-dir -r requirements.txt"
]

[phases.build]
cmds = ["echo 'Verifying data files...' && ls -la data/ || echo 'WARNING: data directory not found'"]

[start]
cmd = "/opt/venv/bin/gunicorn -w 1 --threads 4 -b 0.0.0.0:${PORT} app.main:app"

[variables]
PYTHONUNBUFFERED = "1"
PORT = "8000"
PATH = "/opt/venv/bin:$PATH"

