services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - REDIS_HOST=redis
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
      volumes:
        - redis_data:/data
    volumes:
      redis_data:

